services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pluginwizard-backend
    # Not published on the host: the frontend forwards /api to it.
    # The backend fetches the plugin template from the frontend's public folder
    # (at request time, so no startup ordering is required).
    environment:
      PLUGINWIZARD_TEMPLATE_BASE_URL: "http://frontend:3001"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pluginwizard-frontend
    # Forwards /api/* to the backend, so the tunnel only needs to point here.
    environment:
      BACKEND_URL: "http://backend:8080"
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped
